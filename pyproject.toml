[project]
name = "ibmi-docs-mcp"
version = "0.1.0"
description = "FastMCP server for searching and fetching IBM i documentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "fastmcp>=3.4.6",
    "httpx>=0.28.0",
    "lxml>=5.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibmi_docs_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/ibmi_docs_mcp" = "ibmi_docs_mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
